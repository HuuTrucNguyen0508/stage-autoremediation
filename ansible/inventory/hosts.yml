all:
  children:
    # Environment groups
    dev:
      children:
        frontend_servers:
        backend_servers:
        automation_servers:
        load_balancers:
    
    # Role-based groups
    frontend_servers:
      hosts:
        truh1-frontend:
          ansible_host: 34.195.42.122
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/Documents/truh-autoremed2.pem
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -v'
          private_ip: 34.195.42.122
          public_ip: 34.195.42.122
          instance_id: i-000874f2defac2257
          role: frontend
          environment: dev
          tags:
            - truh1
            - frontend
            - web
          vars:
            app_type: frontend
            docker_compose_path: /home/ubuntu/repo/frontend-ec2
            nginx_port: 80
            node_port: 3000
    
    backend_servers:
      hosts:
        truh1-backend:
          ansible_host: 10.0.2.147
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/Documents/truh-autoremed2.pem
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o ProxyCommand="ssh -i ~/Documents/truh-autoremed2.pem -o StrictHostKeyChecking=no -W %h:%p ubuntu@34.195.42.122"'
          private_ip: 10.0.2.147
          instance_id: i-036f422d3ab52453c
          role: backend
          environment: dev
          tags:
            - truh1
            - backend
            - api
          vars:
            app_type: backend
            docker_compose_path: /home/ubuntu/repo/backend-ec2
            api_port: 80
            database_port: 27017

    automation_servers:
      hosts:
        truh1-automation-runner:
          ansible_host: 10.0.2.65
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/Documents/truh-autoremed2.pem  
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o ProxyCommand="ssh -i ~/Documents/truh-autoremed2.pem -o StrictHostKeyChecking=no -W %h:%p ubuntu@34.195.42.122"'
          private_ip: 10.0.2.65
          instance_id: i-0732adbd7839cc669
          role: automation
          environment: dev
          tags:
            - truh1
            - automation
            - runner
          vars:
            app_type: automation
            webhook_port: 9000
            automation_dir: /opt/automation
    
    load_balancers:
      hosts:
        truh1-internal-alb:
          ansible_host: internal-truh1-internal-alb-1237303710.us-east-1.elb.amazonaws.com
          # Note: ALB is managed by AWS, not directly accessible via SSH
          # This is for reference and potential health checks
          role: load_balancer
          environment: dev
          tags:
            - truh1
            - loadbalancer
            - alb
          vars:
            lb_type: internal
            target_port: 80
            health_check_path: /health
    
    # Application groups
    web_servers:
      children:
        frontend_servers:
    
    api_servers:
      children:
        backend_servers:
    
    # Infrastructure groups
    infrastructure:
      children:
        frontend_servers:
        backend_servers:
        automation_servers:
        load_balancers:
    
    # Monitoring groups (for future use)
    monitoring:
      hosts: {}
    
    # Database groups (for future use)
    databases:
      hosts: {}

  vars:
    # Global variables
    ansible_python_interpreter: /usr/bin/python3
    project_name: truh1-autoremediation
    environment: dev
    aws_region: us-east-1
    vpc_id: vpc-005a4df5735d83370
    domain: aws.ocho.ninja
    frontend_url: http://truhauto.aws.ocho.ninja 