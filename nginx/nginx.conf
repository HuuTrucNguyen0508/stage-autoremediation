# nginx/nginx.conf (VERSION CORRIGÉE)

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Route pour les appels API vers le backend-api
        location /api/ {
            proxy_pass http://backend:8080; # PAS DE SLASH FINAL ICI

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
         location /notification/ {
            rewrite ^/notification/(.*)$ /$1 break;
            proxy_pass http://notification-api:4000/;
            proxy_set_header Host $host;
        }

        # Route pour Prometheus
        location /prometheus/ {
            rewrite ^/prometheus/(.*)$ /$1 break;
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route pour tout le reste (votre application frontend React)
        location / {
            proxy_pass http://frontend:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}

