events {}

http {
    log_format custom_log_format '$remote_addr - $remote_user [$time_local] "$request" '
                                 '$status $body_bytes_sent "$http_referer" '
                                 '"$http_user_agent" request_body: "$request_body"';
    server {
        listen 80;
        access_log /dev/stdout custom_log_format;

        # ---- CONSOLIDATED BACKEND PROXY RULE ----
        # This one location block handles all backend traffic.
        # It matches any URL that starts with /api/, /notification/, /grafana/, etc.
        location ~ ^/(api|notification|grafana|prometheus|jaeger)($|/) {
            resolver 169.254.169.253 valid=30s;
            set $internal_lb "api.internal.aws.ocho.ninja";

            proxy_pass http://$internal_lb$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- YOUR FRONTEND REACT APP ----
        # Any request that doesn't match the backend rule above will be sent here.
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
     
        # ---- WEBHOOK FORWARDING TO AUTOMATION INSTANCE ----
        # Forward webhook requests to the automation EC2 instance via internal ALB
        location /webhook {
            resolver 169.254.169.253 valid=30s;
            set $internal_lb "api.internal.aws.ocho.ninja";
            
            # Remove /webhook prefix and add /hooks prefix for the automation instance
            rewrite ^/webhook/(.*)$ /hooks/$1 break;
            proxy_pass http://$internal_lb:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Webhook specific settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ---- AUTOMATION HEALTH CHECK ----
        location /automation-health {
            resolver 169.254.169.253 valid=30s;
            set $internal_lb "api.internal.aws.ocho.ninja";
            
            proxy_pass http://$internal_lb:9000/hooks/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- OTHER RULES ----
        location = /log-event {
            proxy_pass_request_body on;
            proxy_set_header Content-Type "";
            proxy_pass http://127.0.0.1/internal-log-handler;
        }

        location = /internal-log-handler {
            access_log off;
            return 204;
        }

        location /health {
            access_log off;
            return 200 'Frontend OK';
        }
    }
}
