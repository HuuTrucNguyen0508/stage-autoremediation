global:
  scrape_interval: 15s

rule_files:
  - "prometheus-alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets: ['backend-api-app:8080'] # backend service name, port 8080 (where /metrics is)

  - job_name: 'notification-api'
    static_configs:
      - targets: ['notification-api-app:4000'] # notification-api service name, port 4000

  - job_name: 'database-api'
    static_configs:
      - targets: ['database-api-app:3002'] # database-api service name, port 3002

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'mongodb_exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['mongodb-exporter:9216']
        
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
