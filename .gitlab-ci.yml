# .gitlab-ci.yml

stages:
  - test
  - build
  - merge

test-echo:
  stage: test
  script:
    - echo "Hello, World!"

test-echo-2:
  stage: test
  script:
    - echo "Hello, World 2!"

#Changer l'image python
build-ansible-lint: 
  stage: build
  image: python:3.9-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends bash git
    - pip install --no-cache-dir ansible ansible-lint
  script:
    - echo "Validating Ansible configuration..."
    - |
      for file in $(find ansible/ -name "*.yml" -o -name "*.yaml"); do
        ansible-lint "$file" || echo "Lint warnings in $file"
        ansible-playbook "$file" --syntax-check || echo "Syntax warnings in $file"
      done
    - echo "Ansible validation completed"

build-terraform:
  stage: build
  image: 
    name: hashicorp/terraform:light
    entrypoint: [""]
  script:
    - echo "Validating Terraform configuration..."
    - cd terraform
    - terraform init -input=false -backend=false
    - terraform fmt -check
    - terraform validate
    - echo "Terraform validation completed"

auto_merge:
  stage: merge
  image: alpine
  before_script:
    - apk add --no-cache curl
  script: |
    if [ "$CI_COMMIT_REF_NAME" != "main" ]; then
      echo "Creating merge request for branch: $CI_COMMIT_REF_NAME"
      curl -s -X POST \
        -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{
          \"source_branch\": \"$CI_COMMIT_REF_NAME\",
          \"target_branch\": \"main\",
          \"title\": \"Merge $CI_COMMIT_REF_NAME into main\",
          \"description\": \"Automated merge request created by CI/CD pipeline\",
          \"remove_source_branch\": true
        }" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/merge_requests"
      echo "Merge request created successfully"
    fi
  only:
    - branches
  except:
    - main
